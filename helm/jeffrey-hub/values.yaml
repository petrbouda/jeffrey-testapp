# Default values for jeffrey-hub.

replicaCount: 1

image:
  repository: petrbouda/jeffrey-hub
  # Pin to a specific upstream build for reproducible installs
  # (https://hub.docker.com/r/petrbouda/jeffrey-hub/tags).
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Shared volume the testapp pods write their recordings into and this hub reads from.
# `jeffrey.hub.home.dir` (in application.properties) lives at mountPath. It carries
# recordings only: every application image already contains its own provisioner and
# async-profiler, baked in at build time by the jeffrey-jib extension.
sharedVolume:
  # Both fields below MUST match the testapp charts' sharedVolume block exactly
  # (helm/jeffrey-testapp-{server,client}/values.yaml). All three pods need to
  # see the same bytes at the same path.
  claimName: jeffrey-pvc
  mountPath: /mnt/jeffrey
  # Whether the chart should create the PVC. Set false to bring your own claim.
  create: true
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  # Stay below the NFS provisioner's backing PVC size to leave room for the
  # filesystem overhead — provisioner reports `insufficient available space` if
  # the request equals the backing size.
  capacity: 40Gi
  # Static hostPath PV — only useful on minikube/kind where there is no dynamic
  # RWX provisioner. Leave create=false on real clusters and let the
  # StorageClass dynamically provision the underlying volume.
  hostPath:
    create: false
    path: /tmp/jeffrey-data

# Self-profiling. When true, the JIB image's built-in jeffrey-entrypoint runs
# `provisioner init` before java boots, populating /tmp/jvm.args with profiling
# flags resolved from helm/jeffrey-hub/jeffrey-base.conf. Set to false to
# inject JEFFREY_ENABLED=false and bypass profiling entirely.
selfProfile:
  enabled: true

containerPort: 8080

service:
  type: ClusterIP
  httpPort: 8080

# Ingress is jeffrey-hub-only — exposes the hub's own web UI (the Storage and
# Scheduler pages). The hub has no API to Microscope: Microscope reads the
# recording volume itself. Testapp charts intentionally have no Ingress.
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: jeffrey-hub.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 60
  failureThreshold: 10

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 60
  failureThreshold: 10

# Extra env passed to the container. SPRING_CONFIG_LOCATION is set by the chart.
env: []

nodeSelector: {}
tolerations: []
affinity: {}
