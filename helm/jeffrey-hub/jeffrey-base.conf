# Provisioner init config (HOCON) used by jeffrey-hub's own container to self-profile.
# Read by `provisioner init`, which the jeffrey-jib entrypoint wrapper runs before the JVM
# starts.
#
# No binary is named here. The jeffrey-jib build extension bakes the provisioner and
# async-profiler into the image under /opt/jeffrey and bakes their paths as
# JEFFREY_PROVISIONER_PATH / JEFFREY_PROFILER_PATH; jeffrey-home arrives as the JEFFREY_HOME
# env var the Deployment sets from sharedVolume.mountPath.

provisioner-verbose = true

project {
    name  = "jeffrey-hub"
    label = "Jeffrey Hub"
}

perf-counters {
    enabled = true
}

heap-dump {
    enabled = true
    type = "crash"
}

# JVM unified logging goes through additional-jvm-options. <<JEFFREY:CURRENT_SESSION>> expands
# to this run's session directory, so the log lands beside the recording it belongs to.
additional-jvm-options = "-Xmx600m -Xms600m -XX:+UseG1GC -XX:+AlwaysPreTouch -Xlog:jfr*=trace:file=<<JEFFREY:CURRENT_SESSION>>/jfr-jvm.log::filecount=3,filesize=5m"
