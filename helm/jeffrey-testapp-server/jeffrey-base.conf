# Provisioner init config (HOCON).
# Read by `provisioner init` at container start, which the jeffrey-jib entrypoint wrapper runs
# before the application JVM.
#
# jeffrey-home and profiler-path are intentionally omitted. The provisioner reads jeffrey-home
# from the JEFFREY_HOME env var (set by the Deployment from sharedVolume.mountPath) and takes
# the profiler path from JEFFREY_PROFILER_PATH, which jeffrey-jib bakes into the image next to
# async-profiler itself. Nothing is discovered on disk and no binary comes off the volume.

project {
    name  = ${JEFFREY_TESTAPP_MODE}"-jeffrey-testapp-server"
    label = "Jeffrey TestApp Server ("${JEFFREY_TESTAPP_MODE}")"
}

perf-counters {
    enabled = true
}

heap-dump {
    enabled = true
    type = "crash"
}

# JVM unified logging goes through additional-jvm-options. <<JEFFREY:CURRENT_SESSION>> expands
# to this run's session directory, so the log lands beside the recording it belongs to.
additional-jvm-options = "-Xmx400m -Xms400m -XX:+UseG1GC -XX:+AlwaysPreTouch -Xlog:jfr*=trace:file=<<JEFFREY:CURRENT_SESSION>>/jfr-jvm.log::filecount=3,filesize=5m"
