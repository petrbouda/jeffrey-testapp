# Provisioner init config (HOCON).
# Read by `provisioner init` at container start, which the jeffrey-jib entrypoint wrapper runs
# before the application JVM.
#
# jeffrey-home and profiler-path are intentionally omitted. The provisioner reads jeffrey-home
# from the JEFFREY_HOME env var (set by the Deployment from sharedVolume.mountPath) and takes
# the profiler path from JEFFREY_PROFILER_PATH, which jeffrey-jib bakes into the image next to
# async-profiler itself. Nothing is discovered on disk and no binary comes off the volume.

# The project name is not set here. jeffrey-jib bakes JEFFREY_PROJECT_NAME into the image (the Maven
# artifactId by default) and an environment variable wins over this file, so the Deployment sets
# JEFFREY_PROJECT_NAME itself. It keys the project directory on the shared volume: keep it stable.

# Lowers the thresholds of the JDK events a span is read with (socket and file I/O, monitor
# enter/wait, thread park and sleep, pinned virtual threads), so each span in Jeffrey's Traces view
# shows what it waited on. On by default; stated here because the testapp exists to produce
# trace-rich recordings.
tracing {
    enabled = true
}

perf-counters {
    enabled = true
}

heap-dump {
    enabled = true
    type = "crash"
}

# JVM unified logging goes through additional-jvm-options. <<JEFFREY:CURRENT_SESSION>> expands
# to this run's session directory, so the log lands beside the recording it belongs to.
additional-jvm-options = "-Xmx600m -Xms600m -XX:+UseG1GC -XX:+AlwaysPreTouch -Xlog:jfr*=trace:file=<<JEFFREY:CURRENT_SESSION>>/jfr-jvm.log::filecount=3,filesize=5m"
